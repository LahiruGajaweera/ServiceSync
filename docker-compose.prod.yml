version: "3.9"

# Production compose — uses multi-stage Dockerfiles, no volume mounts for hot-reload.
# Usage:
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Required environment variables (set in .env.prod or export in shell):
#   DB_USER, DB_PASSWORD, DB_NAME, SECRET_KEY
#   VITE_API_URL (must point to the public backend URL)
#   Optional: TEXTLK_API_TOKEN, TEXTLK_SENDER_ID, SMTP_*

services:

  # ─────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: servicesync_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # FastAPI Backend (production — 4 workers)
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: servicesync_backend_prod
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      TEXTLK_API_TOKEN: ${TEXTLK_API_TOKEN:-}
      TEXTLK_SENDER_ID: ${TEXTLK_SENDER_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # React Frontend (nginx static server)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: servicesync_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data_prod:
